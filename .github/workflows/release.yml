# Builds binaries and uploads them to a GitHub release when a v* tag is pushed.
name: Publish release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
  build:
    name: Build release binaries
    runs-on: ${{ matrix.runner-os }}
    needs: create-release
    strategy:
      matrix:
        include:
          - runner-os: ubuntu-24.04 # current challenge server target; also sets the glibc floor (2.39) of the release binary
            rustc-target: "x86_64-unknown-linux-gnu"
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          # Release builds have nothing to restore and would only evict CI caches.
          cache: false
          # Do not let a new stable lint break a tagged release (the action defaults to -D warnings).
          rustflags: ""
      - name: Build
        run: |
          cargo build --release
      - name: Verify binary matches tarball target
        env:
          expected: ${{ matrix.rustc-target }}
        run: |
          # cargo build without --target builds for the host, so the host triple must match the tarball suffix.
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$expected" ]; then
            echo "::error::built for $host but the tarball is named for $expected"
            exit 1
          fi
          file target/release/oci-interceptor
          if command -v objdump > /dev/null; then
            echo "glibc floor: $(objdump -T target/release/oci-interceptor | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          fi
      - name: Create tarball
        run: |
          mkdir out
          cp target/release/oci-interceptor out/
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md out/
          cd out && tar czf oci-interceptor_${suffix}.tar.gz *
        env:
          suffix: ${{ matrix.rustc-target }}
      - name: Upload tarball
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: out/*.tar.gz
